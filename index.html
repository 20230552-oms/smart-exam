<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스마트공장 수준확인 심사원 모의고사</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="start-screen" class="start">
    <h1>스마트공장 수준확인 심사원 모의고사</h1>
    <p>전체 문제 중 25문제를 무작위로 출제합니다.</p>
    <button type="button" id="start-btn" class="btn btn-primary btn-large">모의고사 시작</button>
  </section>

  <section id="exam-screen" class="exam" hidden>
    <header class="topbar">
      <div id="progress" class="progress"></div>
      <div class="actions">
        <button type="button" id="check-btn" class="btn">답 확인</button>
        <button type="button" id="next-btn" class="btn btn-primary">Next</button>
        <button type="button" id="end-btn" class="btn">모의종료</button>
      </div>
    </header>
    <main id="question-area" class="question-area"></main>
    <aside id="answer-area" class="answer-area"></aside>
  </section>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
